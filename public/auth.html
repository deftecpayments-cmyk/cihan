<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول — لوحة التحكم</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Tajawal',sans-serif;background:#e9eaec;background-image:url('assets/cb-pattern.jpg');background-size:cover;background-position:center;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .logo-wrap{margin-bottom:32px;text-align:center}
    .logo-wrap img{width:160px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.18))}
    .card{background:#fff;border-radius:28px;padding:40px 28px 36px;width:100%;max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,.08);margin:0 16px}
    .card h1{font-size:24px;font-weight:800;color:#111;text-align:center;margin-bottom:8px}
    .card p{font-size:14px;color:#6b6b6b;text-align:center;margin-bottom:28px}
    .field{margin-bottom:16px}
    .field label{display:block;font-size:14px;font-weight:700;color:#333;margin-bottom:6px}
    .field input{height:56px;width:100%;border-radius:16px;background:#f2f2f2;border:none;padding:0 24px;font-size:17px;font-family:'Tajawal',sans-serif;color:#333;outline:none;transition:box-shadow .2s}
    .field input:focus{box-shadow:0 0 0 3px rgba(177,24,17,.2)}
    .field input::placeholder{color:#8a8a8a}
    .pw-wrap{position:relative}
    .pw-wrap input{padding-left:52px}
    .toggle-pw{position:absolute;left:16px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#9a9a9a;padding:4px}
    .toggle-pw:hover{color:#333}
    .error-box{background:#fdecea;border-radius:12px;padding:12px 16px;margin-bottom:16px;display:none;font-size:14px;color:#b11811;font-weight:500;text-align:center}
    .error-box.show{display:block}
    .btn{height:56px;width:100%;border-radius:16px;background:#b11811;color:#fff;font-size:19px;font-weight:700;border:none;cursor:pointer;font-family:'Tajawal',sans-serif;transition:background .2s}
    .btn:hover{background:#9c1410}
    .btn:active{background:#8e120e}
    .btn:disabled{opacity:.6;cursor:not-allowed}
  </style>
</head>
<body>
  <div class="logo-wrap">
    <img src="assets/cb-logo.png" alt="Cihan Bank">
  </div>
  <div class="card">
    <h1>لوحة التحكم</h1>
    <p>أدخل كلمة المرور للوصول إلى لوحة الإدارة</p>
    <form id="authForm">
      <div class="field">
        <label for="password">كلمة المرور</label>
        <div class="pw-wrap">
          <input type="password" id="password" placeholder="أدخل كلمة المرور" autocomplete="current-password" required>
          <button type="button" class="toggle-pw" onclick="togglePw()">
            <svg id="eyeIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="error-box" id="errorBox">كلمة المرور غير صحيحة</div>
      <button type="submit" class="btn" id="loginBtn">دخول</button>
    </form>
  </div>

  <script>
    function togglePw() {
      var inp = document.getElementById('password');
      var icon = document.getElementById('eyeIcon');
      if (inp.type === 'password') {
        inp.type = 'text';
        icon.innerHTML = '<path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/>';
      } else {
        inp.type = 'password';
        icon.innerHTML = '<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>';
      }
    }

    document.getElementById('authForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var pw = document.getElementById('password').value;
      var btn = document.getElementById('loginBtn');
      var err = document.getElementById('errorBox');
      btn.disabled = true;
      btn.textContent = 'جارٍ التحقق...';
      err.classList.remove('show');

      fetch('/api/admin/login', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ password: pw })
      })
      .then(function(r){ return r.json().then(function(d){ return {ok: r.ok, data: d} }) })
      .then(function(res) {
        if (res.ok && res.data.ok) {
          try { sessionStorage.setItem('admin_token', res.data.token); } catch(ex){}
          window.location.href = 'admin.html';
        } else {
          err.classList.add('show');
          btn.disabled = false;
          btn.textContent = 'دخول';
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
        }
      })
      .catch(function() {
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'دخول';
      });
    });

    (function checkAuth() {
      try {
        var token = sessionStorage.getItem('admin_token');
        if (token) {
          fetch('/api/admin/verify', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ token: token })
          })
          .then(function(r){ return r.json() })
          .then(function(d){ if (d.ok) window.location.href = 'admin.html'; });
        }
      } catch(ex){}
    })();
  </script>
</body>
</html>
